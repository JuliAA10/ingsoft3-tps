name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Ejecutar tests y verificar cobertura del backend
        run: |
          mkdir -p coverage
          docker run --rm \
            -v "$PWD/coverage:/out" \
            backend-test:ci

      - name: Mostrar resumen de cobertura del backend
        if: ${{ always() }}
        run: |
          if [ -f coverage/backend/summary.md ]; then
            cat coverage/backend/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó el resumen del backend. Revisar los pasos anteriores." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publicar reportes de cobertura del backend
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage/backend/
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/juliaa10/timetracker-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: false
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Ejecutar tests y verificar cobertura del frontend
        run: |
          mkdir -p coverage
          docker run --rm \
            -v "$PWD/coverage:/out" \
            frontend-test:ci \
            npm run test:coverage -- \
            --coverage.reportsDirectory=/out/frontend

      - name: Mostrar resumen de cobertura del frontend
        if: ${{ always() }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = Path("coverage/frontend/coverage-summary.json")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Cobertura del frontend\n\n")

              if not report.exists():
                  summary.write(
                      "No se generó el reporte. Revisar los pasos anteriores.\n"
                  )
                  raise SystemExit(1)

              data = json.loads(report.read_text())
              summary.write(
                  "| Archivo | Sentencias | Ramas | Funciones | Líneas |\n"
              )
              summary.write("|---|---:|---:|---:|---:|\n")

              for filename, metrics in data.items():
                  label = (
                      "TOTAL"
                      if filename == "total"
                      else filename.replace("/app/", "")
                  )
                  values = [
                      str(metrics[key]["pct"]) + "%"
                      for key in ("statements", "branches", "functions", "lines")
                  ]
                  summary.write(
                      "| " + label + " | " + " | ".join(values) + " |\n"
                  )

      - name: Publicar reportes de cobertura del frontend
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/frontend/
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: true
          tags: ghcr.io/juliaa10/timetracker-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25

    environment:
      name: qa
      url: https://timetracker-front-qa.onrender.com

    steps:
      - name: Desplegar en QA el commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMAGE_API: "ghcr.io/juliaa10/timetracker-backend:sha-${{ github.sha }}"
          IMAGE_FRONT: "ghcr.io/juliaa10/timetracker-frontend:sha-${{ github.sha }}"
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_FRONT" ]; then
            echo "Faltan deploy hooks en el environment qa."
            exit 1
          fi

            echo "Solicitando deploy de $IMAGE_API y $IMAGE_FRONT"
            curl -fsS --max-time 30 --get \
              --data-urlencode "imgURL=$IMAGE_API" "$HOOK_API" > /dev/null
            curl -fsS --max-time 30 --get \
              --data-urlencode "imgURL=$IMAGE_FRONT" "$HOOK_FRONT" > /dev/null

      - name: Verificar API, base de datos y frontend de QA
        shell: bash
        env:
          URL_API: https://timetracker-api-qa.onrender.com
          URL_FRONT: https://timetracker-front-qa.onrender.com
        run: |
          for i in $(seq 1 30); do
            echo "Intento $i de 30"

            if curl -fsS --max-time 20 "$URL_API/health" \
                -o /tmp/qa-health.json \
              && python3 -c 'import json; d=json.load(open("/tmp/qa-health.json")); assert d.get("status") == "ok" and d.get("database") == "ok"' \
              && curl -fsS --max-time 20 "$URL_FRONT/" \
                -o /dev/null; then
              echo "QA responde: API, conexion a BD y frontend."
              exit 0
            fi

            sleep 20
          done

          echo "QA no respondio correctamente dentro del tiempo limite."
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    environment:
      name: qa

    defaults:
      run:
        working-directory: client

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-integracion
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/integracion.json

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Probar la API desplegada en QA
        run: npx playwright test e2e/api.spec.js --reporter=list,html,json

      - name: Mostrar resumen de integracion
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("test-results/integracion.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Integración\n\n")
              if not report.exists():
                  out.write("No se generó el reporte. Revisar el job.\n")
                  raise SystemExit(1)
              s = json.loads(report.read_text())["stats"]
              out.write(f'{s["expected"] + s["flaky"]} passed, {s["unexpected"]} failed, {s["flaky"]} flaky, {s["skipped"]} skipped\n')
          PY

      - name: Publicar reporte de integracion
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: client/playwright-report-integracion/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    environment:
      name: qa

    defaults:
      run:
        working-directory: client

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-e2e
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/e2e.json

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium y sus dependencias
        run: npx playwright install --with-deps chromium

      - name: Probar los flujos del usuario en QA
        run: npx playwright test e2e/projects.spec.js --reporter=list,html,json

      - name: Mostrar resumen de e2e
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("test-results/e2e.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## E2E\n\n")
              if not report.exists():
                  out.write("No se generó el reporte. Revisar el job.\n")
                  raise SystemExit(1)
              s = json.loads(report.read_text())["stats"]
              out.write(f'{s["expected"] + s["flaky"]} passed, {s["unexpected"]} failed, {s["flaky"]} flaky, {s["skipped"]} skipped\n')
          PY

      - name: Publicar reporte de e2e
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: client/playwright-report-e2e/
          if-no-files-found: error

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25

    environment:
      name: production
      url: https://timetracker-front-prod.onrender.com

    steps:
      - name: Desplegar en PROD el commit aprobado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMAGE_API: "ghcr.io/juliaa10/timetracker-backend:sha-${{ github.sha }}"
          IMAGE_FRONT: "ghcr.io/juliaa10/timetracker-frontend:sha-${{ github.sha }}"
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_FRONT" ]; then
            echo "Faltan deploy hooks en el environment production."
            exit 1
          fi

          echo "Solicitando deploy de $IMAGE_API y $IMAGE_FRONT"
          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMAGE_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMAGE_FRONT" "$HOOK_FRONT" > /dev/null

      - name: Verificar API, base de datos y frontend de PROD
        shell: bash
        env:
          URL_API: https://timetracker-api-prod.onrender.com
          URL_FRONT: https://timetracker-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            echo "Intento $i de 30"

            if curl -fsS --max-time 20 "$URL_API/health" \
                -o /tmp/prod-health.json \
              && python3 -c 'import json; d=json.load(open("/tmp/prod-health.json")); assert d.get("status") == "ok" and d.get("database") == "ok"' \
              && curl -fsS --max-time 20 "$URL_FRONT/" \
                -o /dev/null; then
              echo "PROD responde: API, conexion a BD y frontend."
              exit 0
            fi

            sleep 20
          done

          echo "PROD no respondio correctamente dentro del tiempo limite."
          exit 1
